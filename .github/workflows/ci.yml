name: CI

on:
  push:
    branches: [ main, 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck and Lint
        run: bun run check

      - name: Run Tests
        run: bun test
